name: Deploy Storybook to YandexCloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  YC_BUCKET: xn--80adsazqn.xn--80avakjqg.xn--p1ai
  YC_REGION: ru-central1
  PUBLIC_URL: https://xn--80adsazqn.xn--80avakjqg.xn--p1ai/

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Deploy to YandexCloud S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.YC_REGION }}
        run: |
          aws s3 sync apps/storybook/storybook-static s3://${{ env.YC_BUCKET }} \
            --endpoint-url https://storage.yandexcloud.net \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp apps/storybook/storybook-static/index.html s3://${{ env.YC_BUCKET }}/index.html \
            --endpoint-url https://storage.yandexcloud.net \
            --cache-control "public, max-age=0, no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Deployment Summary
        run: |
          echo "Deployment completed!"
          echo "Public URL: ${{ env.PUBLIC_URL }}"
          echo "Bucket: s3://${{ env.YC_BUCKET }}"
