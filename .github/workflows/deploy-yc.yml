name: Deploy Demo to YandexCloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  YC_BUCKET: xn--d1acvi.xn--80avakjqg.xn--p1ai
  YC_REGION: ru-central1
  PUBLIC_URL: https://xn--d1acvi.xn--80avakjqg.xn--p1ai/

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo
        run: pnpm --filter @rollout/demo build

      - name: Deploy to YandexCloud S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.YC_REGION }}
        run: |
          # Deploy static assets with long cache
          aws s3 sync apps/demo/dist s3://${{ env.YC_BUCKET }} \
            --endpoint-url https://storage.yandexcloud.net \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          
          # Deploy index.html with no-cache policy
          aws s3 cp apps/demo/dist/index.html s3://${{ env.YC_BUCKET }}/index.html \
            --endpoint-url https://storage.yandexcloud.net \
            --cache-control "public, max-age=0, no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CDN cache (if configured)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          # If you have YC CDN configured, add invalidation logic here
          echo "CDN cache invalidation would go here"

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📱 Public URL: ${{ env.PUBLIC_URL }}"
          echo "🪣 Bucket: s3://${{ env.YC_BUCKET }}"
          echo "🌍 Endpoint: https://storage.yandexcloud.net"
